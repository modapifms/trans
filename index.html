<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">

        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/Limiteemprise_0.js"></script>
        <script src="data/TEP_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[43.50596636577407,6.487571667792923],[43.50639348182651,6.488948026352681]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
 var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'centimeters',
            secondaryLengthUnit: 'meters',
            primaryAreaUnit: 'sqmeters',
            // On définit manuellement l'unité 'centimeters' car elle n'existe pas par défaut
            units: {
                centimeters: {
                    factor: 100, // Multiplie les mètres par 100
                    display: 'cm',
                    decimals: 1
                },
                meters: {
                    factor: 1,
                    display: 'm',
                    decimals: 2
                }
            },
            localization: 'fr',
            activeColor: '#abe67e',
            completedColor: '#c8f2be'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        function pop_Limiteemprise_0(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Limiteemprise_0_0() {
            return {
                pane: 'pane_Limiteemprise_0',
                opacity: 1,
                color: 'rgba(0,0,0,1.0)',
                dashArray: '',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 1.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Limiteemprise_0');
        map.getPane('pane_Limiteemprise_0').style.zIndex = 400;
        map.getPane('pane_Limiteemprise_0').style['mix-blend-mode'] = 'normal';
        var layer_Limiteemprise_0 = new L.geoJson(json_Limiteemprise_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Limiteemprise_0',
            layerName: 'layer_Limiteemprise_0',
            pane: 'pane_Limiteemprise_0',
            onEachFeature: pop_Limiteemprise_0,
            style: style_Limiteemprise_0_0,
        });
        bounds_group.addLayer(layer_Limiteemprise_0);
        map.addLayer(layer_Limiteemprise_0);
        function pop_TEP_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">id</th>\
                        <td>' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Fait</th>\
                        <td>' + (feature.properties['Fait'] !== null ? autolinker.link(String(feature.properties['Fait']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Type St.</th>\
                        <td>' + (feature.properties['Type St.'] !== null ? autolinker.link(String(feature.properties['Type St.']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Unité Str</th>\
                        <td>' + (feature.properties['Unité Str'] !== null ? autolinker.link(String(feature.properties['Unité Str']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_TEP_1_0(feature) {
            switch(String(feature.properties['Phase'])) {
                case 'Antiquité':
                    return {
                pane: 'pane_TEP_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,1.0)',
                interactive: true,
            }
                    break;
                case 'Moderne':
                    return {
                pane: 'pane_TEP_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,0,1.0)',
                interactive: true,
            }
                    break;
                case 'Contemporain':
                    return {
                pane: 'pane_TEP_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,255,224,1.0)',
                interactive: true,
            }
                    break;
                case 'Protohistoire':
                    return {
                pane: 'pane_TEP_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(128,0,128,1.0)',
                interactive: true,
            }
                    break;
                case 'Néolithique':
                    return {
                pane: 'pane_TEP_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,0,255,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_TEP_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(183,185,186,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_TEP_1');
        map.getPane('pane_TEP_1').style.zIndex = 401;
        map.getPane('pane_TEP_1').style['mix-blend-mode'] = 'normal';
        var layer_TEP_1 = new L.geoJson(json_TEP_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_TEP_1',
            layerName: 'layer_TEP_1',
            pane: 'pane_TEP_1',
            onEachFeature: pop_TEP_1,
            style: style_TEP_1_0,
        });
        bounds_group.addLayer(layer_TEP_1);
        map.addLayer(layer_TEP_1);
        setBounds();
        function searchFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
const searchValue = urlParams.get('search');

    if (searchValue) {
        var layers = [layer_TEP_1, layer_Limiteemprise_0];
        var found = false;

        // Création d'une RegExp pour trouver le nombre exact
        // \b assure que c'est une "frontière de mot" (évite 13 dans 1348)
        var regex = new RegExp("\\b" + searchValue + "\\b");

        layers.forEach(function(layer) {
            layer.eachLayer(function(featureLayer) {
                var props = featureLayer.feature.properties;
                
                // Vérification de l'ID (string)
                var matchId = props.id && String(props.id) === searchValue;
                
                // Vérification précise dans "Unité Str"
                var matchUS = props['Unité Str'] && regex.test(String(props['Unité Str']));

                if (matchId || matchUS) {
                    // Zoomer sur l'élément
                    if (featureLayer.getBounds) {
                        map.fitBounds(featureLayer.getBounds(), {maxZoom: 24});
                    } else if (featureLayer.getLatLng) {
                        map.setView(featureLayer.getLatLng(), 24);
                    }

                    // Ouvrir le popup
                    featureLayer.openPopup();
                    found = true;
                }
            });
        });

        if (!found) {
            console.warn("Aucun élément trouvé pour : " + searchValue);
        }
    }
}

        // Lancer la recherche au chargement de la page
        searchFromUrl();
		// --- NOUVEL OUTIL DE MESURE AU CENTIMÈTRE ---
var measurePoints = [];
var measureLine = L.polyline([], {color: 'red', weight: 3}).addTo(map);
var measureLabel = L.marker([0, 0], {
    icon: L.divIcon({
        className: 'measure-label',
        html: '<div style="background:white; padding:2px 5px; border:1px solid red; border-radius:3px; white-space:nowrap; font-weight:bold;">0 cm</div>',
        iconSize: [0, 0]
    })
});

        </script>        
    </body>
</html>
